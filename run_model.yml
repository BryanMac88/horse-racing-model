name: Run horse racing model

on:
  schedule:
    - cron: "*/30 6-21 * * *"   # every 30 min during racing hours (UTC)
    - cron: "15 22 * * *"       # late run: settles results, runs the analysis, targets tomorrow
    - cron: "45 22 * * *"       # second late run: a spare chance to record the night-before prices
  workflow_dispatch: {}

concurrency:
  group: horse-model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run model
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          REGION: ${{ secrets.REGION }}
          MIN_VALUE_EDGE: ${{ secrets.MIN_VALUE_EDGE }}
          # optional settings: leave the secret unset to use the default
          MIN_EV: ${{ secrets.MIN_EV }}
          STRICT_FILTERS: ${{ secrets.STRICT_FILTERS }}
          AUTO_FILTER: ${{ secrets.AUTO_FILTER }}
          USE_FITTED_WEIGHTS: ${{ secrets.USE_FITTED_WEIGHTS }}
          LOG_WINDOW_MIN: ${{ secrets.LOG_WINDOW_MIN }}
          MAX_FIELD_HCAP: ${{ secrets.MAX_FIELD_HCAP }}
          WIN_FOCUS: ${{ secrets.WIN_FOCUS }}
          MIN_WIN_PROB: ${{ secrets.MIN_WIN_PROB }}
          MAX_WIN_DEC: ${{ secrets.MAX_WIN_DEC }}
          MAX_FIELD: ${{ secrets.MAX_FIELD }}
          BEST_RULE: ${{ secrets.BEST_RULE }}
          DEBUG_DUMP: "1"
        run: python horse_model.py

      - name: Save debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
