name: Horse Racing Model

on:
  schedule:
    # 10:00 Dublin ≈ 09:00 UTC (IST) or 10:00 UTC (GMT)
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    # 22:00 Dublin ≈ 21:00 UTC (IST) or 22:00 UTC (GMT)
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:  # manual "Run workflow" button

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google credentials
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: echo "$GOOGLE_CREDS" > credentials.json

      - name: Run horse model
        env:
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          REGION: ${{ secrets.REGION }}
          MIN_VALUE_EDGE: ${{ secrets.MIN_VALUE_EDGE }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: python horse_model.py

      - name: Cleanup credentials
        if: always()
        run: rm -f credentials.json
