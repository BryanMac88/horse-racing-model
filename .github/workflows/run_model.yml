name: Run horse racing model

on:
  schedule:
    - cron: "*/30 6-21 * * *"   # every 30 min during racing hours (UTC)
    - cron: "15 22 * * *"       # late run: settles results, then targets tomorrow
  workflow_dispatch: {}

concurrency:
  group: horse-model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run model
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          REGION: ${{ secrets.REGION }}
          MIN_VALUE_EDGE: ${{ secrets.MIN_VALUE_EDGE }}
          DEBUG_DUMP: "1"
        run: python horse_model.py

      - name: Save debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
